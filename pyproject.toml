[project]
name = "dbtlearn-snowflake-importer"
version = "0.1.0"
description = "Streamlit app to help students set up Snowflake for dbt Zero to Hero course"
requires-python = "==3.13.*"
dependencies = [
    "streamlit==1.67.0",
    "sqlalchemy==2.1.8",
    "snowflake-sqlalchemy==2.1.0",
    "snowflake-connector-python==5.2.0",
    "pydantic==2.14.3",
    "cryptography==50.0.2",
    "pyyaml==6.0.3",
    "watchdog==7.1.0",
    # Security fixes for transitive dependencies
    "urllib3==2.8.0",
    "filelock==4.2.9",
    "gitpython==3.2.1",
    "pillow==13.0.0",
    "pygments==2.21.0",
    "requests==2.34.2",
    "pyopenssl==26.4.0",
    "pyjwt==2.15.1",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "flake8==7.5.0",
    "isort==9.0.2",
    "pytest==9.2.0",
    "pytest-timeout==2.4.0",
    "python-dotenv==1.2.4",
    "playwright==1.64.1",
]
